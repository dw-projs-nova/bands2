{% extends "base.html" %}
{% block title %} {{super()}} - Add Member {% endblock %}
{% block content %}
<h2>Edit Membership for {{ membership.MemberName }}</h2>
<form method="post" id="membershipForm">
    <input type="hidden" name="membership_id" value="{{ membership.MembershipID }}">
    <label>Band:</label>
    <select name="bandid">
        <option value="Select a band">Select a band</option>
        {% for band in bands %}
        <option value="{{ band.BandID }}" {% if band.BandID == membership.BandID %}selected{% endif %}>{{ band.BandName }}</option>
        {% endfor %}
    </select><br />
    <label>Member:</label>
    <select name="memberid">
        <option value="Select a member">Select a member</option>
        {% for member in members %}
        <option value="{{ member.MemberID }}" {% if member.MemberID == membership.MemberID %}selected{% endif %}>{{ member
.MemberName }}</option>
        {% endfor %}
    </select><br />
    <label>Role:</label><input type="text" name="role" value="{{ membership.Role }}"><br />
    <label>Start Year:</label><input type="number" name="startyear"
    value="{{ membership.StartYear }}"><br />
    <label>End Year:</label><input type="number" name="endyear"
    value="{{ membership.EndYear }}"><br />
    <button type="submit">Save Membership</button>
</form>
{% endblock %}
